name: Preview Release
on:
  push:
    tags: ["v*-preview*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing preview tag to (re)build, e.g. v0.0.1-preview.3"
        required: true
permissions:
  contents: write

jobs:
  # --- Linux desktop bundles (.deb + .rpm) ---
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yoube/desktop build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Tubelight ${{ inputs.tag || github.ref_name }} (preview)"
          releaseBody: "Preview build — Linux bundles below + Android APK. Auto-update is not wired yet (placeholder key); grab the new version from here. Note: in-app downloads are disabled on Android in this preview (no official yt-dlp Android binaries)."
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false

  # --- Android debug APK (all 4 ABIs) ---
  build-android:
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK, CMake, platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yoube/desktop build
      - name: Build Android debug APK
        working-directory: apps/desktop
        run: pnpm exec tauri android build --debug
      - name: List APKs
        run: find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk"
      - name: Upload APKs to preview release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" \
            $(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk") \
            --clobber
