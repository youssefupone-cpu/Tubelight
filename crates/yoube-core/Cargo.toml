[package]
name = "yoube-core"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
# NOTE: yoube-yt-dlp is intentionally NOT declared here. Declaring it would
# create a package-level cycle (yoube-yt-dlp -> yoube-core for AppResult, and
# yoube-core -> yoube-yt-dlp), which Cargo rejects regardless of `optional`.
# yoube-core does not reference the yoube_yt_dlp crate in code today (only the
# AppError::YtDlp(String) variant). Task 1.3 (wiring YoutubeService) should
# re-add it via a design that avoids this cycle (e.g., shared error crate or
# dependency injection).
yoube-filter = { path = "../yoube-filter" }
yoube-dns = { path = "../yoube-dns" }
yoube-storage = { path = "../yoube-storage" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
    thiserror.workspace = true
    anyhow.workspace = true
    async-trait.workspace = true
    tracing.workspace = true
    reqwest.workspace = true
    sqlx.workspace = true
    yoube-yt-dlp = { path = "../yoube-yt-dlp" }
    yoube-error = { path = "../yoube-error" }
    specta = { version = "2.0.0-rc.25", optional = true, default-features = false }

[features]
default = []
# `specta` is feature-gated and offline-deferred: `--features specta` requires
# cached `specta-macros`/proc-macro closure which this offline index lacks.
# The `cfg_attr(feature = "specta", derive(specta::Type))` gates keep the
# default offline build clean. Restore under network (Task 1.4 contracts).
specta = ["dep:specta", "yoube-yt-dlp/specta"]
