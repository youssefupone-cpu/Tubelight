[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/yoube-core",
    "crates/yoube-error",
    "crates/yoube-yt-dlp",
    "crates/yoube-filter",
    "crates/yoube-dns",
    "crates/yoube-storage",
]
[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
# Strip debuginfo from dev builds: Android debug .so files otherwise ship
# ~200MB of dwarf data per ABI (universal APK approached 900MB).
# Panic messages and line-level traces for workspace crates are unaffected
# enough for preview debugging; use `strip = "none"` locally if full
# debuginfo is ever needed.
[profile.dev]
strip = "debuginfo"
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
adblock = "0.13"
dashmap = "6"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
